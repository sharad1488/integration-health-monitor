services:
  backend:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  intelligence:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: intelligence-python/Dockerfile
    environment:
      SPRING_BOOT_BASE_URL: http://backend:8080/api/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      backend:
        condition: service_healthy
